<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Калькулятор с клавиатурным вводом, скобками и историей вычислений.">
  <title>Калькулятор</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="workspace">
    <header class="page-heading">
      <h1>Калькулятор</h1>
    </header>

    <section class="calculator" aria-labelledby="display-label">
      <div class="readout">
        <div class="readout-top">
          <label for="calc-display" id="display-label">Вычисление</label>
          <span id="calc-context"></span>
        </div>
        <input id="calc-display" type="text" value="0" readonly autocomplete="off" spellcheck="false">
        <p id="calc-status" class="readout-status" role="status"></p>
      </div>

      <div class="keypad" role="group" aria-label="Клавиши калькулятора">
        <button type="button" data-key="Escape" class="utility" aria-label="Очистить">C</button>
        <button type="button" data-key="Backspace" class="utility" aria-label="Удалить последний символ">⌫</button>
        <button type="button" data-key="(" class="utility" aria-label="Открыть скобку">(</button>
        <button type="button" data-key=")" class="utility" aria-label="Закрыть скобку">)</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" data-key="/" class="operator" aria-label="Деление">÷</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="*" class="operator" aria-label="Умножение">×</button>
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="-" class="operator" aria-label="Вычитание">−</button>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="." aria-label="Десятичная точка">.</button>
        <button type="button" data-key="=" class="equals" aria-label="Вычислить">=</button>
        <button type="button" data-key="+" class="operator" aria-label="Сложение">+</button>
      </div>

      <p class="shortcuts"><kbd>Enter</kbd> вычислить <kbd>Esc</kbd> очистить</p>
    </section>

    <section class="history" aria-labelledby="history-title">
      <h2 id="history-title">История</h2>
      <p id="history-empty">Здесь появятся результаты вычислений.</p>
      <ol id="history-list"></ol>
    </section>
  </main>
</body>
</html>
